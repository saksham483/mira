services:
  mira-perception:
    build:
      context: .
      dockerfile: docker/perception.Dockerfile
    image: mira-perception:latest
    container_name: mira_perception
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    tty: true
    volumes:
      - .:/workspace
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=10
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    working_dir: /workspace

  mira-controls:
    build:
      context: .
      dockerfile: docker/controls.Dockerfile
    image: mira-controls:latest
    container_name: mira_controls
    network_mode: host
    ipc: host
    privileged: true
    tty: true
    volumes:
      - .:/workspace
      - /dev:/dev
    environment:
      - ROS_DOMAIN_ID=20
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    working_dir: /workspace